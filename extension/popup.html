<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Symbiot</title>
<style>
  body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:14px 16px;width:300px;color:#1d1d1f;background:#fff}
  h1{font-size:15px;margin:0 0 4px}
  p{margin:0 0 10px;color:#4a4a4f}
  #state{font-weight:600}
  ul{list-style:none;margin:0 0 12px;padding:0}
  li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #e5e5ea}
  li span{flex:1;overflow-wrap:anywhere}
  button{font:inherit;border-radius:8px;border:1px solid #c7c7cc;background:#f5f5f7;color:#1d1d1f;padding:5px 12px;cursor:pointer}
  button.go{background:#0a66c2;border-color:#0a66c2;color:#fff}
  button:focus-visible{outline:2px solid #0a66c2;outline-offset:2px}
  h2{font-size:13px;margin:12px 0 4px;color:#4a4a4f;font-weight:600}
</style>
</head>
<body>
<h1>Symbiot</h1>
<p id="state">…</p>
<div id="asks"></div>
<div id="sites"></div>
<button id="stop" type="button"></button>
<script src="popup.js"></script>
</body>
</html>
