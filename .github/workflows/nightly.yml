name: nightly

# The whole suite on Windows, every night, with a table of every file that failed
# (test/run.mjs). Windows isn't green there yet, so this blocks nothing; it ran on
# every PR push until 20 Oct 2026 and took 44-46 minutes each time. What has to work
# on Windows (test/windows.mjs) still runs on every PR, in ci.yml. The files known to
# fail there are in test/windows-known.txt: the run fails only when another one does,
# so a red nightly (and GitHub's "All jobs have failed" mail) means a new break.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  windows-suite:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@symbiot.local"
          git config --global user.name "symbiot ci"
      - name: The whole suite on Windows
        env:
          SYMBIOT_NO_OPEN: "1"
          SYMBIOT_TEST_JOBS: "2"
        run: node test/run.mjs --known test/windows-known.txt
