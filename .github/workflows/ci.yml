name: ci

# Runs the test suite on every PR and feature-branch push, so pull requests get
# a status check. This is what the per-repo "auto-merge on green CI" toggle waits
# for: enable branch protection on main requiring the "test" check, and an
# approved PR merges itself only once this passes.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Lint
        # no-undef / no-unused-vars only (eslint.config.js): catches a name
        # lost when code moves between modules, before the suite runs
        run: npm run lint
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@symbiot.local"
          git config --global user.name "symbiot ci"
      - name: Test
        # the whole suite, the same as publish.yml runs before a release —
        # including the npm pack + global install layer, so a PR that breaks the
        # installed `symbiot` bin fails here, not after it's on npm
        env:
          SYMBIOT_NO_OPEN: "1"
        run: npm test

  windows:
    # Symbiot on a Windows PC. test/windows.mjs is what has to work there (it starts,
    # opens into setup, finds your Claude subscription through claude.cmd, long
    # instructions get through, uninstall works): it must pass. The whole suite runs
    # too, each file on its own with a table at the end: Windows isn't green there yet,
    # so that step reports without blocking.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@symbiot.local"
          git config --global user.name "symbiot ci"
      - name: What has to work on Windows
        env:
          SYMBIOT_NO_OPEN: "1"
        run: node test/windows.mjs
      - name: The whole suite on Windows (reports, doesn't block yet)
        continue-on-error: true
        env:
          SYMBIOT_NO_OPEN: "1"
        run: node test/each.mjs
