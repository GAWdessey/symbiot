name: publish

# Trusted operator: publish to npm automatically when main's package.json
# version advances — no manual tag, no 2FA/QR, no credential on anyone's machine.
# The only human gate is the Approve in Symbiot (which opens the PR + bumps the
# version); once that PR's CI is green it auto-merges, lands on main, and this
# runs. Publishing is npm Trusted Publishing (OIDC). Filename stays `publish.yml`
# so the npm trusted-publisher binding (npmjs.com → symbiot) keeps matching.
#
# Source of truth is NPM, not a git tag — a v* tag-protection ruleset can block
# the Action from pushing tags, so we don't depend on them: gate checks whether
# this version is already on npm (skip if so), and publish is idempotent (a
# concurrent "already published" counts as success). The record tag is pushed
# best-effort and never fails the run.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "symbiot@$v" version >/dev/null 2>&1; then
            echo "symbiot@$v is already on npm — nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "symbiot@$v is a new version — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@symbiot.local"
          git config --global user.name "symbiot ci"
      - name: Test
        env:
          SYMBIOT_NO_OPEN: "1"
        run: npm test

  publish:
    needs: [gate, test]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # for the best-effort record tag
      id-token: write # npm OIDC trusted publishing
    env:
      VER: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm new enough for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Publish (OIDC — no token), idempotent
        run: |
          if npm publish; then
            echo "published symbiot@$VER"
          elif npm view "symbiot@$VER" version >/dev/null 2>&1; then
            echo "symbiot@$VER already on npm (concurrent run) — treating as success."
          else
            echo "::error::publish failed and $VER is not on npm"; exit 1
          fi
      - name: Record tag (best-effort — ok if a ruleset blocks it)
        continue-on-error: true
        run: |
          git tag "v$VER" || true
          git push origin "v$VER" || echo "tag push skipped (protected); npm is the source of truth"
