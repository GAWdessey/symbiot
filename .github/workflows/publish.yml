name: publish

# Publish to npm via Trusted Publishing (OIDC) — no token, no 2FA/QR prompt.
# Fires when a version tag (created by `npm version`) is pushed, and can also be
# run by hand from the Actions tab. Requires a one-time setup on npmjs.com:
# the symbiot package → Settings → Trusted Publishing → add GitHub Actions with
#   user/org: GarthGhostai   repo: symbiot   workflow: publish.yml
#
# Two jobs: `test` runs the whole suite (the same ci.yml that gates pushes and
# PRs) and `publish` only starts if it passed (`needs: test`), so a broken build
# can't reach npm. Only `publish` gets the OIDC token.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm new enough for OIDC trusted publishing
        run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - name: Publish (OIDC — no token)
        run: npm publish
