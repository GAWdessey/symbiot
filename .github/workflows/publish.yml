name: publish

# Trusted operator: publish to npm automatically when main's package.json
# version advances — no manual tag, no 2FA/QR, no credential on anyone's machine.
# The only human gate is the Approve in Symbiot (which opens the PR + bumps the
# version); once that PR's CI is green it auto-merges, lands on main, and this
# runs. Publishing is npm Trusted Publishing (OIDC); the record tag is pushed by
# the Action's own GITHUB_TOKEN. Filename stays `publish.yml` so the npm trusted-
# publisher binding (npmjs.com → symbiot → Trusted Publishing) keeps matching.
#
# gate decides whether this commit is a new release (version has no v<ver> tag
# yet); test runs the whole suite; publish only runs for a new version, so an
# ordinary push to main that didn't bump the version publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          git fetch --tags --quiet origin || true
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v already released — nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$v is a new version — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Git identity for tests
        run: |
          git config --global user.email "ci@symbiot.local"
          git config --global user.name "symbiot ci"
      - name: Test
        env:
          SYMBIOT_NO_OPEN: "1"
        run: npm test

  publish:
    needs: [gate, test]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the record tag
      id-token: write # npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm new enough for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Publish (OIDC — no token)
        run: npm publish
      - name: Tag the release (record)
        run: |
          git tag "v${{ needs.gate.outputs.version }}"
          git push origin "v${{ needs.gate.outputs.version }}"
