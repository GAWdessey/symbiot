name: publish

# DIAGNOSTIC BRANCH ONLY (never merged): asks npm why OIDC trusted publishing refuses
# this repo, without publishing anything or printing any token.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: What GitHub tells npm, and what npm answers
        run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "--- claims in GitHub's identity token (no signature, no secrets):"
          python3 - "$T" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split(".")[1]; p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ["iss","aud","repository","repository_owner","repository_id","repository_owner_id","workflow","workflow_ref","job_workflow_ref","ref","event_name","environment","runner_environment"]:
              print(f"{k}: {c.get(k)}")
          PY
          echo "--- npm's answer to the token exchange (any token in it is removed):"
          curl -s -w '\nHTTP %{http_code}\n' -X POST -H "Authorization: Bearer $T" https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/symbiot | python3 -c '
          import sys, json
          raw = sys.stdin.read(); body, _, code = raw.rpartition("\nHTTP ")
          try:
              j = json.loads(body); j.pop("token", None); print(json.dumps(j))
          except Exception:
              print(body[:300])
          print("HTTP", code.strip())'
